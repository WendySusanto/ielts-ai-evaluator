name: Deploy to Azure Functions (.NET 8 isolated)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/azure-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "functions-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test backend/IELTS.AI.Evaluator.sln -c Release

      - name: Publish
        run: >
          dotnet publish backend/IELTS.AI.Evaluator.Functions/IELTS.AI.Evaluator.Functions.csproj
          -c Release -o ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
