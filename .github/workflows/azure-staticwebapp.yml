name: Deploy to Azure Static Web Apps (Vite + React)

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: "swa-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Azure Static Web Apps action will install deps and build by default using Oryx.
      # For Vite, make sure output_location is "dist".
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # For PR comments
          action: "upload"
          app_location: "/frontend/ielts-ai-evaluator-frontend"          # Change if your app is in a subfolder (e.g., "frontend")
          api_location: ""           # Set to your Functions API folder if you have one (e.g., "api")
          output_location: "dist"    # Vite build output
          # Optional: override Oryx build commands if you need a specific package manager or flags:
          # app_build_command: "npm ci && npm run build"
          # api_build_command: ""

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Azure Static Web Apps PR Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
